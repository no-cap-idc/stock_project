name: Daily Stock Kakao Alarm

on:
  schedule:
    # 한국 시간 08:30 -> UTC 23:30 (전날)
    - cron: '30 23 * * *'
    # 한국 시간 15:40 -> UTC 06:40
    - cron: '40 6 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  send-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 주식 알림 스크립트 실행
        env:
          KAKAO_TOKEN: ${{ secrets.KAKAO_TOKEN }}
        run: python stock_briefing.py
